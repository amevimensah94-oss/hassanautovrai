backend:
  name: git-gateway
  branch: main

media_folder: "images/voitures"
public_folder: "/images/voitures"

locale: "fr"

collections:
  - name: "voitures_a_vendre"
    label: "Voitures à vendre (jusqu'à 10)"
    label_singular: "Voiture"
    files:
      - name: "voiture1"
        label: "Voiture 1"
        file: "content/voiture1.json"
        fields:
          - { label: "Photo de la voiture", name: "photo", widget: "image", required: false, hint: "Une seule photo par voiture." }
          - { label: "Caractéristiques", name: "caracteristiques", widget: "text", required: false, hint: "Marque, modèle, année, prix, kilométrage, état... tout en un seul texte libre." }

